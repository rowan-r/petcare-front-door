<style>

.scroll{height:100%;overflow:auto;border-radius:inherit}
.tablet .screen{border-radius:20px}
.sb{display:flex;justify-content:space-between;padding:12px 22px 6px;font-size:12px;font-weight:700}
.ph{padding:0 18px 22px}

.logoRow{display:flex;justify-content:center;margin:8px 0 22px}.vcalogo{height:48px;width:auto}

.prow{display:flex;align-items:center;gap:14px;margin:0 0 6px}.prow h3{margin:0 0 2px;font-size:22px}.prow .avatar.big{width:72px;height:72px;margin:0;box-shadow:0 0 0 3px #fff}
.avatar.big{width:96px;height:96px;font-size:42px;margin:0 auto 8px;box-shadow:0 0 0 4px #fff}
.center{text-align:center}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin:10px 0}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:6px;font-weight:700}
.mixbar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:6px 0 4px}
.mixbar span{display:block}
.mixlegend{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--ln)}
.sw:first-of-type{border-top:0}
.sw small{display:block;color:var(--mut);font-size:12px}
.switch{width:44px;height:26px;border-radius:13px;background:#C9C4D6;border:0;position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.switch[aria-checked="true"]{background:var(--blue)}
.switch[aria-checked="true"]::after{left:21px}
.cta{width:100%;background:var(--red);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:15px;margin-top:10px}
.cta.blue{background:var(--blue)}
.cta.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.fine{font-size:11.5px;color:var(--mut);margin-top:8px;text-align:center}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--ln);font-size:14px}.kv:first-child{border-top:0}.kv>span{color:var(--mut);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.kv.blk{display:block}.kv.blk>span{display:block;margin-bottom:3px}.kv.blk>div{margin-top:4px}
.rchips{display:flex;flex-wrap:wrap;gap:6px}.rchip{border:1px solid var(--ln);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:6px}.rchip small{font-size:10.5px;font-weight:700;color:var(--blue);background:#E7E9FF;border-radius:999px;padding:2px 7px}.rchip.now small{background:#FFE3E0;color:#A3141F}.rchip.sel{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.rdet{margin-top:10px;font-size:13px;color:var(--mut);background:var(--cream);border-radius:10px;padding:9px 11px}.rdet b{color:var(--ink)}

.risk .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}

.risk .det{display:none;margin-top:8px;font-weight:400;color:var(--mut);font-size:13px}

.bubble{background:#fff;border:1px solid var(--ln);border-radius:16px 16px 16px 4px;padding:11px 13px;margin:6px 0 10px}

.price{font-size:26px;font-weight:700;font-family:var(--serif)}

ul.tick{list-style:none;padding:0;margin:8px 0 0}

ul.tick li::before{content:"";position:absolute;left:2px;top:8px;width:10px;height:6px;border-left:2.5px solid var(--blue);border-bottom:2.5px solid var(--blue);transform:rotate(-45deg)}
.cal{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--ln)}
.cal:first-of-type{border-top:0}

.cal small{display:block;color:var(--mut)}
.cal>div:not(.d){flex:1;min-width:0}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:16px 18px 22px;box-shadow:0 -10px 30px rgba(0,0,0,.2);animation:up .25s ease-out}

.pre span:first-child{color:var(--mut)}

.wb{padding:0 16px 16px}
.barrow{display:grid;grid-template-columns:150px 1fr 34px;gap:8px;align-items:center;font-size:12.5px;margin:6px 0}
.bt{height:10px;background:#EFE7DA;border-radius:5px}

.pipe{display:flex;gap:6px;margin:8px 0}
.pst{flex:1;font-size:11.5px;border:1.5px solid var(--ln);border-radius:10px;padding:6px;background:#fff;color:var(--mut)}

.sheet{max-height:86%;overflow:auto}
.avatar.photo{background-size:cover;background-position:center;color:transparent}

.rec{font-size:11.5px;color:#C0182B;font-weight:700;margin-left:6px}

.row2{display:flex;gap:8px;margin-top:8px}.row2 .cta{margin-top:0;flex:1;padding:10px;font-size:13.5px}
.ok{color:#0B6B2E;font-weight:700;font-size:12px}
.tchips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tchip{border:1.5px solid var(--ln);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--ink)}

<body>
<header class="top">
  <div class="tag">Illustrative prototype · For discussion · Synthetic data only</div>
  <h1 class="h1plain">Look behind the scenes to see what Digital, Data and Technology capabilities are needed to build a Digital Front Door for Petcare</h1>
  <div class="stepper" id="stepper" role="tablist" aria-label="Journey steps"></div>
</header>
<main>
  <section class="stage" aria-label="Experience">
    <div class="persona" id="persona"></div>

  h+='<button class="step'+(i===S.step&&!S.land?' on':'')+'" role="tab" aria-selected="'+(i===S.step&&!S.land)+'" data-go="'+i+'"><b>'+(i+1)+'</b>'+s.t+'</button>';
 });

 h+='<div class="nav"><button class="bs" id="bsw" role="switch" aria-checked="'+on+'"><i></i>Behind the scenes</button><button data-go="prev"'+(S.land?' disabled style="opacity:.4;cursor:default"':'')+'>Back</button><button class="primary" data-go="next"'+(!S.land&&S.step>=STEPS.length-1?' disabled style="opacity:.4;cursor:default"':'')+'>Next</button></div>';

  if(g==="prev"&&S.step===0&&!S.land){clearTimers();S.land=true;render();return}
  go(g==="next"?S.step+1:g==="prev"?S.step-1:+g);
 })});
}
function go(n){
 if(n<0||n>=STEPS.length)return;
 clearTimers();S.land=false;S.step=n;S.sheet=false;S.fam=false;S.vs="";S.tele=false;S.pm=false;S.club=false;S.dietOpen=false;S.shop=false;S.cart=false;S.ordered=false;S.toast="";S.open=-1;
 if(n===3||n===4)S.tier="comp";
 render();
}
function render(){var m=$("main");if(m)m.className=S.back?"":"solo";renderStepper();renderStage();renderBack();window.scrollTo(0,0)}
document.addEventListener("keydown",function(e){
 if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
 if(e.key==="ArrowRight"){if(S.land)go(0);else if(S.step<STEPS.length-1)go(S.step+1)}
 if(e.key==="ArrowLeft"){if(S.land)return;if(S.step===0){clearTimers();S.land=true;render()}else go(S.step-1)}
});
render();
})();
